<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hotel Plaset Reservations</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      font-family: Arial, sans-serif;
      background: #eef2f7;
    }

    .form-container {
      max-width: 500px;
      margin: 50px auto;
      background: white;
      padding: 35px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #222;
    }

    .description {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      margin-top: 18px;
      font-weight: bold;
      color: #333;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      font-family: Arial, sans-serif;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #007bff;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <div class="form-container">

    <h1>Contact Me</h1>

    <div class="description">
      Send me a message using the form below.
    </div>

    <form
      action="https://formsubmit.co/rebeccajklein@gmail.com"
      method="POST"
    >

      <label for="name">Name</label>

      <input
        type="text"
        id="name"
        name="name"
        placeholder="Your name"
        required
      >


      <label for="email">Email</label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
      >


      <label for="message">Message</label>

      <textarea
        id="message"
        name="message"
        placeholder="Write your message here..."
        required
      ></textarea>


      <!-- Email subject -->
      <input
        type="hidden"
        name="_subject"
        value="New Contact Form Message"
      >

      <input
  type="hidden"
  name="_next"
  value="https://Mbappboy.github.io/my-contact-form/thank-you.html"
>


      <!-- Prevent FormSubmit's CAPTCHA -->
      <input
        type="hidden"
        name="_captcha"
        value="false"
      >


      <button type="submit">
        Send Message
      </button>

    </form>

  </div>

</body>

</html>
